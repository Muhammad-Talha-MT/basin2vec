[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "basin2vec"
version = "0.1.0"
description = "Programmatic access to pretrained Basin2Vec basin-year embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "Muhammad Talha" }
]
keywords = [
    "hydrology",
    "watersheds",
    "streamflow",
    "embeddings",
    "representation-learning",
    "geospatial-machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "numpy>=1.24",
    "pooch>=1.8"
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "twine>=5"
]

[project.urls]
Homepage = "https://github.com/Muhammad-Talha-MT/basin2vec"
Repository = "https://github.com/Muhammad-Talha-MT/basin2vec"
Issues = "https://github.com/Muhammad-Talha-MT/basin2vec/issues"
Releases = "https://github.com/Muhammad-Talha-MT/basin2vec/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/basin2vec"]
