# Publish the basin2vec package to PyPI.
#
# Run manually from the Actions tab ("Publish to PyPI" -> "Run workflow").
# Uses PyPI trusted publishing, so no API token is stored in the repository.
# One-time setup on PyPI: add a (pending) trusted publisher for project
# "basin2vec" with owner Muhammad-Talha-MT, repository basin2vec,
# workflow publish.yml and environment pypi (on test.pypi.org: environment
# testpypi). Create both environments under Settings -> Environments.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install ".[dev]"
          python -m pytest -q

      - name: Build
        run: |
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
